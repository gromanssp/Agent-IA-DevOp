    <script>
        // Single Page App hack for GitHub Pages
        // Stores the current path in sessionStorage and redirects to root
        // The index.html will then restore the path via history.replaceState
        sessionStorage.redirect = location.href;
        location.replace(location.origin + location.pathname.split('/').slice(0, 1).join('/'));
    </script>
